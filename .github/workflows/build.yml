name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and add our code
        run: |
          flutter create --platforms=android --org com.kabsa kabsa_app
          cp lib/main.dart kabsa_app/lib/main.dart
          cp pubspec.yaml kabsa_app/pubspec.yaml
      - name: Configure AdMob + Android
        working-directory: kabsa_app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' $M
          sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8040428097634812~5167640078"/></application>|' $M
          sed -i 's|android:label="[^"]*"|android:label="كبسة"|' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle*
      - name: Build release APK
        working-directory: kabsa_app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: kabsa-apk
          path: kabsa_app/build/app/outputs/flutter-apk/app-release.apk
